<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- The Wayfarer's Bookplate, drawn larger for the README: the teal container, the vellum open book,
       the copper trail and the north-star compass point, with light and depth. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#1A8C8A"/>
      <stop offset="0.55" stop-color="#0E6E6E"/>
      <stop offset="1" stop-color="#084B4C"/>
    </linearGradient>
    <radialGradient id="tileGlow" cx="0.3" cy="0.18" r="0.75">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="0.6" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="leftPage" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FBF9F4"/>
      <stop offset="0.82" stop-color="#F3EFE5"/>
      <stop offset="1" stop-color="#D9D1BF"/>
    </linearGradient>
    <linearGradient id="rightPage" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#FFFDF8"/>
      <stop offset="0.82" stop-color="#F5F1E8"/>
      <stop offset="1" stop-color="#D9D1BF"/>
    </linearGradient>
    <linearGradient id="edges" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E4DCCB"/>
      <stop offset="1" stop-color="#C9BEA6"/>
    </linearGradient>
    <linearGradient id="copper" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#C2662B"/>
      <stop offset="1" stop-color="#F0954F"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFC98F" stop-opacity="0.85"/>
      <stop offset="0.45" stop-color="#F29A55" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#D97736" stop-opacity="0"/>
    </radialGradient>
    <filter id="bookShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="9"/>
      <feOffset dy="12" result="blur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.45"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="tileShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="7"/>
      <feOffset dy="8"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="tileClip">
      <rect x="20" y="16" width="472" height="472" rx="104"/>
    </clipPath>
  </defs>

  <!-- Container -->
  <g filter="url(#tileShadow)">
    <rect x="20" y="16" width="472" height="472" rx="104" fill="url(#tile)"/>
  </g>
  <rect x="20" y="16" width="472" height="472" rx="104" fill="url(#tileGlow)"/>
  <!-- A faint map grid on the teal, for the travelling theme -->
  <g clip-path="url(#tileClip)" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="2">
    <path d="M20 120 H492 M20 220 H492 M20 320 H492 M20 420 H492"/>
    <path d="M120 16 V488 M220 16 V488 M320 16 V488 M420 16 V488"/>
  </g>
  <rect x="21.5" y="17.5" width="469" height="469" rx="102.5" fill="none" stroke="url(#rim)" stroke-width="3"/>

  <!-- Open book -->
  <g filter="url(#bookShadow)">
    <!-- Page block (thickness) -->
    <path d="M78 366 C140 346 206 350 252 376 C298 350 364 346 434 366 L434 382 C364 362 298 366 252 392 C206 366 140 362 78 382 Z" fill="url(#edges)"/>
    <path d="M78 373 C140 353 206 357 252 383 M434 373 C364 353 298 357 252 383" fill="none" stroke="#B8AB90" stroke-width="1.5" opacity="0.7"/>
    <!-- Left page -->
    <path d="M250 132 C204 104 132 98 78 118 L78 366 C140 346 206 350 250 376 Z" fill="url(#leftPage)"/>
    <!-- Right page -->
    <path d="M254 132 C300 104 380 98 434 118 L434 366 C364 346 298 350 254 376 Z" fill="url(#rightPage)"/>
    <!-- Gutter -->
    <path d="M250 132 L250 376 L254 376 L254 132 Z" fill="#B9AD95"/>
  </g>

  <!-- Text lines on the left page -->
  <g stroke="#0E6E6E" stroke-opacity="0.18" stroke-width="7" stroke-linecap="round" fill="none">
    <path d="M108 156 C150 146 190 150 222 164"/>
    <path d="M108 186 C150 176 190 180 222 194"/>
    <path d="M108 216 C150 206 176 208 196 216"/>
  </g>

  <!-- Wandering trail: from the lower left page, over the gutter, to the compass point -->
  <path d="M102 330 C140 306 182 312 222 290 C262 268 270 262 302 252 C334 242 356 226 368 204"
        fill="none" stroke="url(#copper)" stroke-width="12" stroke-linecap="round" stroke-dasharray="15 17"/>
  <circle cx="102" cy="330" r="9" fill="#C2662B"/>

  <!-- North-star compass point on the upper right leaf -->
  <g transform="translate(372 182)">
    <circle r="64" fill="url(#halo)"/>
    <circle r="42" fill="none" stroke="#D97736" stroke-width="5" stroke-opacity="0.55"/>
    <circle r="42" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.6" stroke-dasharray="2 9"/>
    <!-- Four points, each with a lit and a shaded facet -->
    <path d="M0 -58 L13 -13 L0 0 Z" fill="#F7A464"/>
    <path d="M0 -58 L-13 -13 L0 0 Z" fill="#C2662B"/>
    <path d="M58 0 L13 13 L0 0 Z" fill="#C2662B"/>
    <path d="M58 0 L13 -13 L0 0 Z" fill="#F7A464"/>
    <path d="M0 58 L-13 13 L0 0 Z" fill="#F7A464"/>
    <path d="M0 58 L13 13 L0 0 Z" fill="#A85522"/>
    <path d="M-58 0 L-13 13 L0 0 Z" fill="#A85522"/>
    <path d="M-58 0 L-13 -13 L0 0 Z" fill="#D97736"/>
    <!-- The minor points -->
    <path d="M0 0 L22 -22 L9 -4 Z M0 0 L22 22 L4 9 Z M0 0 L-22 22 L-9 4 Z M0 0 L-22 -22 L-4 -9 Z" fill="#E88A48" opacity="0.8"/>
    <circle r="8" fill="#FFF8EE"/>
    <circle r="3.5" fill="#D97736"/>
  </g>

  <!-- A glint on the star -->
  <g transform="translate(388 128)" fill="#FFFFFF" opacity="0.9">
    <path d="M0 -9 L2 -2 L9 0 L2 2 L0 9 L-2 2 L-9 0 L-2 -2 Z"/>
  </g>
</svg>
